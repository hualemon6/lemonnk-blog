<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About 视觉方向</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f7f7f5;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} main{max-width:1120px;margin:auto;padding:48px 24px}h1{font-size:28px;margin:0}.intro{color:#666;margin:10px 0 30px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fbfbfa;border:1px solid #ddd;padding:18px;min-height:480px;cursor:pointer}.card:hover,.card.selected{border:2px solid #1a56db}.label{color:#1a56db;font-size:12px;font-weight:700;letter-spacing:.08em}.avatar{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:#171717;color:white;border:5px solid #fbfbfa;box-shadow:0 0 0 1px #1a56db;font-size:34px}.name{font-size:34px;line-height:1;font-weight:750;letter-spacing:-.05em}.muted{color:#707070;font-size:13px;line-height:1.6}.rule{height:1px;background:#ddd;margin:28px 0 18px}.head{display:flex;align-items:center;gap:20px;margin-top:48px}.facts{display:grid;gap:14px}.fact{display:flex;justify-content:space-between;font-size:14px}.fact span:first-child{color:#777}.fact span:last-child{font-weight:650}.poster{background:#1d1d1f;color:#f7f7f5;min-height:360px;margin:10px -6px 0;padding:35px;display:grid;justify-items:center;align-content:center;text-align:center}.poster .avatar{background:#eee;color:#222;box-shadow:0 0 0 1px #edc86a;margin-bottom:22px}.poster .name{font-size:46px}.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:25px}.tags span{border:1px solid #555;padding:5px 8px;font-size:12px}.index{margin-top:48px}.index .avatar{margin-bottom:28px;background:#e6e6e1;color:#222;box-shadow:0 0 0 1px #aaa}.rows{border-top:1px solid #ddd;margin-top:28px}.rows div{padding:13px 0;border-bottom:1px solid #ddd;font-size:14px}.rows span{color:#777;display:inline-block;width:55px}@media(max-width:800px){.grid{grid-template-columns:1fr}.card{min-height:0}}
  </style>
</head>
<body><main><h1>About 的信息层级</h1><p class="intro">头像建立锚点，三条事实替代自我说明。点击选择。</p><section class="grid">
<article class="card selected" data-choice="editorial" onclick="toggleSelect(this)"><p class="label">A · 推荐 / 编辑型</p><div class="head"><div class="avatar">●</div><div><div class="name">LemonNK</div><p class="muted">personal notes</p></div></div><div class="rule"></div><div class="facts"><div class="fact"><span>TYPE</span><span>INFJ</span></div><div class="fact"><span>MAJOR</span><span>NJU IS</span></div><div class="fact"><span>FAV. ALBUM</span><span>新地球</span></div></div><p class="muted">头像与姓名形成主视觉，像唱片内页，克制但有记忆点。</p></article>
<article class="card" data-choice="poster" onclick="toggleSelect(this)"><p class="label">B · 海报型</p><div class="poster"><div class="avatar">●</div><div class="name">LemonNK</div><div class="tags"><span>INFJ</span><span>NJU IS</span><span>新地球</span></div></div><p class="muted">更有个人态度，但会让博客变得接近作品集。</p></article>
<article class="card" data-choice="index" onclick="toggleSelect(this)"><p class="label">C · 索引型</p><div class="index"><div class="avatar">●</div><div class="name">LemonNK</div><div class="rows"><div><span>01</span>INFJ</div><div><span>02</span>NJU IS</div><div><span>03</span>爱专 · 新地球</div></div></div><p class="muted">最克制，但头像和情绪感会被压低。</p></article>
</section></main></body></html>
